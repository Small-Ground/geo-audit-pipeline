# LiteLLM proxy config — fronts Gemini's free tier with an OpenAI-compatible API.
# The scorer calls http://litellm:4000/v1/chat/completions with model "gemini-2.0-flash".
model_list:
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true          # tolerate params a model doesn't support
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
