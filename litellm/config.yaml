# LiteLLM proxy config — OpenAI-compatible API in front of the LLM backend.
# The scorer calls http://litellm:4000/v1/chat/completions with the model name
# set in LLM_MODEL. Groq is the default (genuinely open free tier); Gemini
# entries are kept for when a free-tier-enabled Google account is available.
model_list:
  # --- Groq free tier (default) ---
  - model_name: llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: llama-3.1-8b-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
  # --- Gemini (optional fallback) ---
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true          # tolerate params a model doesn't support
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
